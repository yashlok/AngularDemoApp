<div class="container mt-4">
  <h2>Create Container</h2>
  <div class="card">
    <div class="card-body">
      <div *ngIf="successMessage" class="alert alert-success" role="alert">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>
      <div class="mb-3">
        <label for="containerName" class="form-label">Container Name</label>
        <input type="text" class="form-control" id="containerName" [(ngModel)]="containerName" placeholder="Enter container name">
      </div>
      <button class="btn btn-primary" [disabled]="!containerName || creating" (click)="createContainer()">
        <span *ngIf="creating" class="spinner-border spinner-border-sm me-2"></span>
        {{ creating ? 'Creating...' : 'Create' }}
      </button>
    </div>
  </div>
</div>
